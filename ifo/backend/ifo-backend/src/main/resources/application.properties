# Lê o .env da raiz do repositório (rodando da raiz ou da pasta do backend)
spring.config.import=optional:file:.env[.properties],optional:file:../../../.env[.properties]

# Banco de Dados (valores vêm de variáveis de ambiente ou do .env)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ifo_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate: o esquema é criado só pelo Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway
spring.flyway.locations=classpath:db/migration

# Segurança
ifo.jwt.secret=${JWT_SECRET}
ifo.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:480}
ifo.cors.origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# Server
server.port=${PORT:8081}
server.error.include-stacktrace=never

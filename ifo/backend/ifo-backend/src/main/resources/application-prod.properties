# Perfil de produção (Render + Neon, ADR-018). Ativar com SPRING_PROFILES_ACTIVE=prod.
# Todo segredo e toda URL continuam vindo de variáveis de ambiente (DB_URL, DB_USER, DB_PASSWORD,
# JWT_SECRET, CORS_ORIGINS); aqui ficam só os ajustes de execução.

# O Render termina o HTTPS e repassa para a API por HTTP (lê X-Forwarded-*)
server.forward-headers-strategy=framework

# Poucos recursos no plano gratuito (~512 MB)
server.tomcat.threads.max=20

# O Neon suspende o banco após 5 min sem uso e derruba as conexões: pool pequeno, conexões
# renovadas com frequência e nenhuma mantida ociosa. Sem keepalive, para o banco poder dormir
# e economizar as CU-hours do plano gratuito.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000
# Dá tempo de o banco acordar na primeira requisição
spring.datasource.hikari.connection-timeout=30000

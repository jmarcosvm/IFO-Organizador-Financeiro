<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar · IFO</title>
    <!-- Aplica o tema salvo antes da pintura (evita "piscar"); ver js/tema.js -->
    <script>
      try {
        var t = localStorage.getItem("ifo.tema");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/componentes.css" />
  </head>
  <body>
    <a class="pular-conteudo" href="#conteudo">Ir para o conteúdo</a>

    <div class="autenticacao">
      <main id="conteudo" class="autenticacao-caixa">
        <h1>IFO</h1>
        <p class="subtitulo">Inteligência Financeira Organizada</p>

        <form id="form-login" class="formulario" novalidate>
          <div class="campo">
            <label for="email">E-mail</label>
            <input
              class="entrada"
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              placeholder="voce@email.com"
              required
            />
          </div>

          <div class="campo">
            <label for="senha">Senha</label>
            <input
              class="entrada"
              type="password"
              id="senha"
              name="senha"
              autocomplete="current-password"
              required
            />
          </div>

          <button type="submit" class="btn btn-primario btn-bloco">Entrar</button>
        </form>

        <p class="texto-centro" style="margin-top: var(--espaco-5)">
          Não tem conta? <a href="cadastro.html">Cadastre-se</a>
        </p>
      </main>
    </div>

    <script type="module" src="js/telas/login.js"></script>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metas · IFO</title>
    <!-- Aplica o tema salvo antes da pintura (evita "piscar"); ver js/tema.js -->
    <script>
      try {
        var t = localStorage.getItem("ifo.tema");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/componentes.css" />
  </head>
  <body>
    <a class="pular-conteudo" href="#conteudo">Ir para o conteúdo</a>
    <header id="navbar" class="navbar"></header>

    <main id="conteudo" class="conteudo pilha">
      <div class="cabecalho-pagina">
        <h1>Metas</h1>
        <button type="button" id="nova-meta" class="btn btn-primario">+ Nova meta</button>
      </div>

      <div id="lista-metas" aria-live="polite"></div>
    </main>

    <footer class="rodape">IFO · Inteligência Financeira Organizada · Projeto acadêmico FATEC Cotia</footer>

    <script type="module" src="js/telas/metas.js"></script>
  </body>
</html>

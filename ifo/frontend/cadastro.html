<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar conta · IFO</title>
    <!-- Aplica o tema salvo antes da pintura (evita "piscar"); ver js/tema.js -->
    <script>
      try {
        var t = localStorage.getItem("ifo.tema");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/componentes.css" />
  </head>
  <body>
    <a class="pular-conteudo" href="#conteudo">Ir para o conteúdo</a>

    <div class="autenticacao">
      <main id="conteudo" class="autenticacao-caixa">
        <h1>IFO</h1>
        <p class="subtitulo">Crie sua conta gratuita</p>

        <form id="form-cadastro" class="formulario" novalidate>
          <div class="campo">
            <label for="nome">Nome completo</label>
            <input class="entrada" type="text" id="nome" name="nome" autocomplete="name" required />
          </div>

          <div class="campo">
            <label for="email">E-mail</label>
            <input
              class="entrada"
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              placeholder="voce@email.com"
              required
            />
          </div>

          <div class="campo">
            <label for="senha">Senha</label>
            <input
              class="entrada"
              type="password"
              id="senha"
              name="senha"
              autocomplete="new-password"
              minlength="8"
              aria-describedby="ajuda-senha"
              required
            />
            <span id="ajuda-senha" class="campo-ajuda">Mínimo de 8 caracteres.</span>
          </div>

          <div class="campo">
            <label for="confirmar-senha">Confirmar senha</label>
            <input
              class="entrada"
              type="password"
              id="confirmar-senha"
              name="confirmarSenha"
              autocomplete="new-password"
              required
            />
          </div>

          <div class="campo">
            <label for="renda">Renda mensal (R$)</label>
            <input
              class="entrada"
              type="number"
              id="renda"
              name="rendaMensal"
              inputmode="decimal"
              step="0.01"
              min="0"
              aria-describedby="ajuda-renda"
              required
            />
            <span id="ajuda-renda" class="campo-ajuda">
              Usada para calcular seus limites pela regra 50/30/20.
            </span>
          </div>

          <button type="submit" class="btn btn-primario btn-bloco">Criar conta</button>
        </form>

        <p class="texto-centro" style="margin-top: var(--espaco-5)">
          Já tem conta? <a href="index.html">Entrar</a>
        </p>
      </main>
    </div>

    <script type="module" src="js/telas/cadastro.js"></script>
  </body>
</html>

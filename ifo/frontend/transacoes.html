<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transações · IFO</title>
    <!-- Aplica o tema salvo antes da pintura (evita "piscar"); ver js/tema.js -->
    <script>
      try {
        var t = localStorage.getItem("ifo.tema");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/componentes.css" />
  </head>
  <body>
    <a class="pular-conteudo" href="#conteudo">Ir para o conteúdo</a>
    <header id="navbar" class="navbar"></header>

    <main id="conteudo" class="conteudo pilha">
      <div class="cabecalho-pagina">
        <h1>Transações</h1>
        <div class="linha">
          <button type="button" id="exportar-csv" class="btn btn-contorno">Exportar CSV</button>
          <button type="button" id="nova-transacao" class="btn btn-primario">+ Nova transação</button>
        </div>
      </div>

      <div id="filtro"></div>

      <!-- Alerta de orçamento depois de lançar uma despesa (RF14) -->
      <div id="area-alerta" role="status" aria-live="polite"></div>

      <section class="cartao" aria-label="Lista de transações">
        <div id="lista"></div>
      </section>
    </main>

    <footer class="rodape">IFO · Inteligência Financeira Organizada · Projeto acadêmico FATEC Cotia</footer>

    <script type="module" src="js/telas/transacoes.js"></script>
  </body>
</html>

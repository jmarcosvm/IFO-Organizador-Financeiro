<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IFO - Investimentos</title>
    <link rel="stylesheet" href="css/estilo.css" />
  </head>
  <body>
    <header class="header">
      <nav class="navbar">
        <div class="logo">IFO</div>
        <ul class="menu">
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="transacoes.html">Transações</a></li>
          <li><a href="metas.html">Metas</a></li>
          <li><a href="orcamentos.html">Orçamentos</a></li>
          <li><a href="investimentos.html" class="ativo">Investimentos</a></li>
        </ul>
        <div class="usuario" id="nome-usuario" onclick="logout()">Douglas</div>
      </nav>
    </header>

    <main class="container">
      <section class="card">
        <h2>Simulador de Investimentos</h2>

        <div class="grid-2 mb-3">
          <div>
            <div class="form-group">
              <label>Tipo de Investimento</label>
              <select
                id="tipo-investimento"
                class="form-control"
                onchange="mostrarCamposInvestimento()"
              >
                <option value="unico">Aplicação Única</option>
                <option value="mensal">Aporte Mensal</option>
                <option value="ambos">Aplicação + Aporte Mensal</option>
              </select>
            </div>

            <div class="form-group" id="campo-aplicacao-inicial">
              <label>Aplicação Inicial (R$)</label>
              <input
                type="number"
                id="aplicacao-inicial"
                class="form-control"
                value="1000"
                min="0"
              />
            </div>

            <div class="form-group" id="campo-aporte-mensal">
              <label>Valor Mensal (R$)</label>
              <input
                type="number"
                id="valor-mensal"
                class="form-control"
                value="300"
                min="0"
              />
            </div>

            <div class="form-group">
              <label>Taxa de Juros (% ao mês)</label>
              <input
                type="number"
                id="taxa-juros"
                class="form-control"
                value="1.0"
                step="0.1"
                min="0"
              />
            </div>

            <div class="form-group">
              <label>Tempo (meses)</label>
              <input
                type="number"
                id="tempo-meses"
                class="form-control"
                value="12"
                min="1"
              />
            </div>

            <div class="form-group">
              <label>Tipo de Juros</label>
              <select id="tipo-juros" class="form-control">
                <option value="COMPOSTO">Juros Compostos</option>
                <option value="SIMPLES">Juros Simples</option>
              </select>
            </div>

            <button
              type="button"
              class="btn btn-primary"
              onclick="simularInvestimento()"
            >
              Simular
            </button>
          </div>

          <div id="resultado-investimento">
            <div class="card">
              <h3>Resultados da Simulação</h3>
              <p>
                Preencha os dados e clique em "Simular" para ver os resultados.
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>IFO - Organizador Financeiro Inteligente © 2025 | Sprint 3</p>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>

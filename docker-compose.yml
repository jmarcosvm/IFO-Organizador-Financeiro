name: ifo

services:
  db:
    image: postgres:15
    container_name: ifo-db
    environment:
      POSTGRES_DB: ${DB_NAME:-ifo_db}
      POSTGRES_USER: ${DB_USER:?defina DB_USER no arquivo .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    ports:
      - "5432:5432"
    volumes:
      - ifo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ifo-db-data:
